name: Analyze recent public observations
on:
  workflow_dispatch:
    inputs:
      latitude:
        description: "Circle center latitude (-90..90); optional"
        required: false
        type: string
      longitude:
        description: "Circle center longitude (-180..180); optional"
        required: false
        type: string
      radius_km:
        description: "Circle radius in km (default 50)"
        required: false
        default: "50"
        type: string
      window_hours:
        description: "Observation window in hours (default 24, max 168)"
        required: false
        default: "24"
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Analyze retained snapshots without writing data
        env:
          INPUT_LATITUDE: ${{ inputs.latitude }}
          INPUT_LONGITUDE: ${{ inputs.longitude }}
          INPUT_RADIUS_KM: ${{ inputs.radius_km }}
          INPUT_WINDOW_HOURS: ${{ inputs.window_hours }}
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          import gzip
          import json
          import os
          import statistics
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          base = ('https://api.cloudflare.com/client/v4/accounts/'
                  f"{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/"
                  f"{os.environ['CLOUDFLARE_KV_NAMESPACE_ID']}")
          headers = {'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"}
          query = urlencode({'prefix': 'snapshot:', 'limit': 1000})
          with urlopen(Request(f'{base}/keys?{query}', headers=headers), timeout=30) as response:
              listing = json.load(response)
          keys = listing.get('result')
          if listing.get('success') is not True or not isinstance(keys, list) or len(keys) >= 1000:
              raise RuntimeError('Snapshot list is incomplete')
          snapshots = []
          for item in keys:
              name = item.get('name')
              if not isinstance(name, str) or not name.startswith('snapshot:'):
                  continue
              with urlopen(Request(f'{base}/values/{quote(name, safe="")}',
                                   headers=headers), timeout=45) as response:
                  raw = response.read(5 * 1024 * 1024 + 1)
              if len(raw) > 5 * 1024 * 1024:
                  raise RuntimeError('Snapshot exceeds Free value budget')
              snapshot = json.loads(gzip.decompress(raw))
              if snapshot.get('manifest', {}).get('schema_version') != 1:
                  raise RuntimeError('Unexpected snapshot schema')
              snapshots.append(snapshot)
          if not snapshots:
              raise RuntimeError('No retained snapshots')

          parse = datetime.fromisoformat
          snapshots.sort(key=lambda row: parse(row['manifest']['last_scan_at']))
          scans = [parse(row['manifest']['last_scan_at']) for row in snapshots]
          latest = snapshots[-1]
          at = scans[-1]
          intervals = [round((b-a).total_seconds()/60, 1)
                       for a, b in zip(scans, scans[1:])]
          gaps = [{'from': a.isoformat(), 'to': b.isoformat(),
                   'minutes': round((b-a).total_seconds()/60, 1)}
                  for a, b in zip(scans, scans[1:]) if (b-a).total_seconds() > 90*60]
          events = latest['events']
          incidents = latest['incidents']
          matches = latest['matches']
          ages = Counter()
          days = Counter()
          sources = Counter()
          multi_source = 0
          spatial_hours = {}
          invalid_candidate_times = 0
          for event in events:
              observed = parse(event['observed_at'])
              age = (at-observed).total_seconds()/3600
              invalid_candidate_times += age < 0 or age > 72
              ages['0-24h' if age < 24 else '24-48h' if age < 48 else '48-72h'] += 1
              days[observed.date().isoformat()] += 1
              location = (event['latitude'], event['longitude'])
              spatial_hours.setdefault(location, set()).add(observed.strftime('%Y-%m-%dT%H'))
              for source in event.get('sources', []):
                  sources[source] += 1
              multi_source += len(event.get('sources', [])) > 1
          providers = Counter(row['provider'] for row in incidents)
          updated_72h = Counter()
          unknown_update = Counter()
          for row in incidents:
              modified = row.get('modified_at')
              if not modified:
                  unknown_update[row['provider']] += 1
              elif (at-parse(modified)).total_seconds() <= 72*3600:
                  updated_72h[row['provider']] += 1
          match_status = Counter(row['status'] for row in matches)
          source_error_scans = Counter()
          source_errors_by_scan = []
          for snapshot in snapshots:
              errors = snapshot['manifest'].get('source_errors', [])
              if errors:
                  source_errors_by_scan.append({
                      'at': snapshot['manifest']['last_scan_at'], 'sources': errors})
              for source in errors:
                  source_error_scans[source] += 1
          latest_sources = {}
          for row in latest['sources']:
              latest_sources[row['key']] = {
                  'status': row['status'],
                  'last_product_observed_at': row.get('last_product_observed_at'),
                  'product_age_hours': round(row['product_age_seconds']/3600, 1)
                      if row.get('product_age_seconds') is not None else None,
              }
          result = {
              'analyzed_at_utc': datetime.now(timezone.utc).isoformat(),
              'retained_snapshot_count': len(snapshots),
              'first_scan_at': scans[0].isoformat(),
              'last_scan_at': at.isoformat(),
              'scan_interval_median_minutes': round(statistics.median(intervals), 1)
                  if intervals else None,
              'scan_interval_max_minutes': max(intervals) if intervals else None,
              'gaps_over_90_minutes': gaps,
              'source_error_snapshot_counts': dict(source_error_scans),
              'source_errors_by_scan': source_errors_by_scan,
              'latest_manifest': latest['manifest'],
              'duplicate_candidate_id_count': len(events) - len({row['event_id'] for row in events}),
              'invalid_candidate_time_count': invalid_candidate_times,
              'spatial_cell_count': len(spatial_hours),
              'spatial_cells_observed_2_or_more_hours': sum(len(v) >= 2 for v in spatial_hours.values()),
              'spatial_cells_observed_6_or_more_hours': sum(len(v) >= 6 for v in spatial_hours.values()),
              'spatial_cells_observed_24_or_more_hours': sum(len(v) >= 24 for v in spatial_hours.values()),
              'maximum_observed_hours_for_one_spatial_cell': max(map(len, spatial_hours.values())),
              'candidate_count_by_age': dict(ages),
              'candidate_count_by_observation_day_utc': dict(sorted(days.items())),
              'candidate_count_by_sensor_membership': dict(sources),
              'multi_source_candidate_count': multi_source,
              'agency_incident_count_by_provider': dict(providers),
              'agency_incidents_updated_within_72h': dict(updated_72h),
              'agency_incidents_without_update_time': dict(unknown_update),
              'proximity_match_count_by_status': dict(match_status),
              'matched_candidate_count': len({row['event_id'] for row in matches}),
              'latest_sources': latest_sources,
          }
          lat = os.environ.get('INPUT_LATITUDE', '').strip()
          lon = os.environ.get('INPUT_LONGITUDE', '').strip()
          if bool(lat) != bool(lon):
              raise ValueError('Specify both latitude and longitude, or neither')
          if lat:
              from fire_public.region_diagnostics import summarize_circle
              region = summarize_circle(events, latitude=float(lat), longitude=float(lon),
                  radius_km=float(os.environ['INPUT_RADIUS_KM']), as_of=at,
                  window_hours=float(os.environ['INPUT_WINDOW_HOURS']))
              region['source_errors'] = latest['manifest'].get('source_errors', [])
              region['data_status'] = latest['manifest'].get('data_status')
              print('REGION_JSON=' + json.dumps(region, sort_keys=True))
          print('ANALYSIS_JSON=' + json.dumps(result, sort_keys=True))
          PY
