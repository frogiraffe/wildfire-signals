name: Offline CAL FIRE source lineage gate
on:
  pull_request:
    paths:
      - 'fire_public/calfire_lineage_audit.py'
      - 'fire_public/calfire_blind_review.py'
      - 'fire_public/mtbs_event_corroboration.py'
      - 'tests/test_calfire_lineage_audit.py'
      - 'tests/test_calfire_blind_review.py'
      - '.github/workflows/test-calfire-lineage-audit.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/calfire_lineage_audit.py'
      - 'fire_public/calfire_blind_review.py'
      - 'fire_public/mtbs_event_corroboration.py'
      - 'tests/test_calfire_lineage_audit.py'
      - 'tests/test_calfire_blind_review.py'
      - '.github/workflows/test-calfire-lineage-audit.yml'
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay original evidence and verify reviewer provenance graph
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_calfire_lineage_audit.py' -v
          python -m unittest discover -s tests -p 'test_calfire_blind_review.py' -v
