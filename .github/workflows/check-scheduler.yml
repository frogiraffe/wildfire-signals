name: Check backup scheduler receipts
on:
  workflow_dispatch:
    inputs:
      test_dispatch:
        description: Test scheduler token with a non-forced collect run
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read latest Cron receipt from Free KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode, quote
          from urllib.request import Request, urlopen

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          namespace = '191f9f5e688f436fa60e5a5f8ca89d53'
          base = (f'https://api.cloudflare.com/client/v4/accounts/{account}'
                  f'/storage/kv/namespaces/{namespace}')
          headers = {'Authorization': f'Bearer {token}'}
          query = urlencode({'prefix': 'scheduler:tick:', 'limit': 1000})
          with urlopen(Request(f'{base}/keys?{query}', headers=headers), timeout=30) as reply:
              payload = json.load(reply)
          if payload.get('success') is not True or not isinstance(payload.get('result'), list):
              raise RuntimeError('Cloudflare KV receipt listing failed')
          names = sorted((item['name'] for item in payload['result']
                          if isinstance(item.get('name'), str)), reverse=True)
          if not names:
              raise RuntimeError('No Cron invocation receipt yet')
          with urlopen(Request(f'{base}/values/{quote(names[0], safe="")}',
                               headers=headers), timeout=30) as reply:
              receipt = json.load(reply)
          if not isinstance(receipt, dict) or receipt.get('at') != names[0].split('scheduler:tick:', 1)[1]:
              raise RuntimeError('Latest Cron receipt is malformed')
          print(json.dumps({'latest_receipt': receipt}, sort_keys=True))
          recent = []
          for name in names[:12]:
              with urlopen(Request(f'{base}/values/{quote(name, safe="")}',
                                   headers=headers), timeout=30) as reply:
                  recent.append(json.load(reply))
          print(json.dumps({'recent_receipts': recent}, sort_keys=True))
          for key in ('current', 'scheduler:last_dispatch'):
              try:
                  with urlopen(Request(f'{base}/values/{quote(key, safe="")}',
                                       headers=headers), timeout=30) as reply:
                      value = json.load(reply)
              except Exception as exc:
                  if getattr(exc, 'code', None) == 404:
                      value = None
                  else:
                      raise
              if key == 'current' and isinstance(value, dict):
                  value = {'last_scan_at': value.get('last_scan_at'),
                           'key_shape_valid': isinstance(value.get('key'), str)
                              and value['key'].startswith('snapshot:')
                              and len(value['key']) == 73}
          print(json.dumps({key: value}, sort_keys=True))
          PY
      - name: Test scheduler GitHub token with non-forced collection
        if: inputs.test_dispatch == true
        env:
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          url = ('https://api.github.com/repos/frogiraffe/wildfire-signals/'
                 'actions/workflows/collect.yml/dispatches')
          body = json.dumps({'ref': 'main',
                             'inputs': {'force_collection': False}}).encode()
          request = Request(url, data=body, method='POST', headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['SCHEDULER_GITHUB_TOKEN']}",
              'Content-Type': 'application/json',
              'User-Agent': 'wildfire-signals-scheduler-check',
              'X-GitHub-Api-Version': '2026-03-10',
          })
          try:
              with urlopen(request, timeout=20) as response:
                  print(f'GitHub dispatch HTTP {response.status}')
          except HTTPError as exc:
              print(f'GitHub dispatch HTTP {exc.code}')
              raise
          PY
