name: Historical scan-aware FIRMS statistical analysis
on:
  pull_request:
    paths:
      - 'fire_public/historical_signal_analysis.py'
      - 'fire_public/pixel_history.py'
      - 'tests/test_historical_signal_analysis.py'
      - '.github/workflows/test-historical-signal-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/historical_signal_analysis.py'
      - 'fire_public/pixel_history.py'
      - 'tests/test_historical_signal_analysis.py'
      - '.github/workflows/test-historical-signal-analysis.yml'
permissions:
  contents: read
jobs:
  statistical-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify historical statistics and release source integrity
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_historical_signal_analysis.py' -v
          python -m unittest discover -s tests -p 'test_pixel_history.py' -v
          python -m unittest discover -s tests -p 'test_workbench_pixel_integration.py' -v
