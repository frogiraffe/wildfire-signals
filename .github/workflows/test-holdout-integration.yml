name: Research holdout integration tests
on:
  pull_request:
    paths:
      - 'fire_public/holdout_audit.py'
      - 'fire_public/holdout_workbench.py'
      - 'tests/test_holdout_audit.py'
      - 'tests/test_holdout_workbench.py'
      - '.github/workflows/test-holdout-integration.yml'
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research modules
        run: python -m compileall -q fire_public/holdout_audit.py fire_public/holdout_workbench.py
      - name: Verify holdout audit and workbench
        run: python -m unittest discover -s tests -p 'test_holdout*.py' -v
