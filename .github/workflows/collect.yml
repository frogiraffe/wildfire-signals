name: Collect public fire observations
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      force_collection:
        description: Bypass the 55-minute cadence only for manual repair
        type: boolean
        required: true
        default: true
permissions:
  contents: write
concurrency:
  group: public-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.ENABLE_PUBLIC_COLLECTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_FREE_ATTESTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_FREE_ATTESTED_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
      PUBLIC_SNAPSHOT_URL: ${{ vars.PUBLIC_SNAPSHOT_URL }}
      FORCE_COLLECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.force_collection == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Collect and publish
        env:
          ENABLE_ANALYSIS_ARCHIVE: ${{ vars.ENABLE_ANALYSIS_ARCHIVE }}
          ANALYSIS_RECEIPT_DIR: ${{ runner.temp }}/wildfire-analysis-receipts
        run: python -m fire_public.cli
      - name: Upload bounded analysis receipts
        if: vars.ENABLE_ANALYSIS_ARCHIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wildfire-analysis-receipts/*.json.gz
            ${{ runner.temp }}/wildfire-analysis-receipts/*.jsonl.gz
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 0
      - name: Publish immutable daily research evidence
        if: vars.ENABLE_ANALYSIS_ARCHIVE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANALYSIS_RECEIPT_DIR: ${{ runner.temp }}/wildfire-analysis-receipts
        run: |
          if compgen -G "$ANALYSIS_RECEIPT_DIR/firms-pixel-scan-*.json.gz" > /dev/null; then
            python -m fire_public.release_archive
          else
            echo 'No research receipt in this collection window'
          fi
