name: Check live map in browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked browser tooling
        run: npm ci
      - name: Install Chromium only
        run: npx playwright install chromium --with-deps
      - name: Check desktop and mobile live data
        run: node tests/browser/live-map.mjs
