name: Historical navigation checks
on:
  pull_request:
    paths:
      - 'public/analytics.html'
      - 'public/analytics-page.mjs'
      - '.github/workflows/test-historical-navigation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/analytics-page.mjs
      - run: npm run test:public
