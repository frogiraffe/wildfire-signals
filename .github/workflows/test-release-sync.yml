name: FIRMS research release synchronization tests
on:
  pull_request:
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/pixel_history.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_pixel_history.py'
      - '.github/workflows/test-release-sync.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/pixel_history.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_pixel_history.py'
      - '.github/workflows/test-release-sync.yml'
permissions:
  contents: read
jobs:
  release-sync-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GitHub release discovery and full offline sync-import-report chain
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_release_sync.py' -v
          python -m unittest discover -s tests -p 'test_pixel_history.py' -v
          python -m unittest discover -s tests -p 'test_release_archive.py' -v
          python -m unittest discover -s tests -p 'test_historical_context.py' -v
