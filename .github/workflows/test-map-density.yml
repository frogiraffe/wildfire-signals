name: Map density visualization checks
on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/js/map-display-contract.test.mjs'
      - '.github/workflows/test-map-density.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/main.mjs
      - run: node --test tests/js/map-display-contract.test.mjs
      - run: npm run test:public
