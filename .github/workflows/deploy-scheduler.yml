name: Deploy Free backup scheduler
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-free-backup-scheduler
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ENABLE_PUBLIC_COLLECTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify existing Cloudflare Free account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_ATTESTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_FREE_ATTESTED_ACCOUNT_ID }}
          CLOUDFLARE_BILLING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from fire_public.cli import verify_free
          verify_free(os.environ['CLOUDFLARE_ACCOUNT_ID'],
                      os.environ['CLOUDFLARE_BILLING_TOKEN'],
                      attested_account=os.environ['CLOUDFLARE_FREE_ATTESTED_ACCOUNT_ID'])
          print('Cloudflare Free gate passed')
          PY
      - name: Test backup scheduler
        run: node --test tests/js/scheduler.test.mjs
      - name: Deploy Worker and its single Cron Trigger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SCHEDULER_GITHUB_TOKEN"
          secret_file="$RUNNER_TEMP/wildfire-scheduler-secret.json"
          trap 'rm -f "$secret_file"' EXIT
          python - "$secret_file" <<'PY'
          import json
          import os
          import sys
          path = sys.argv[1]
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump({'GITHUB_DISPATCH_TOKEN': os.environ['SCHEDULER_GITHUB_TOKEN']}, output)
          PY
          npm exec --yes --package=wrangler@4.149.0 -- wrangler deploy \
            --config scheduler-worker/wrangler.jsonc --secrets-file "$secret_file"
