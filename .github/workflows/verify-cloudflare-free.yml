name: Verify Cloudflare Free account
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse paid or unverifiable account subscriptions
        run: |
          python - <<'PY'
          import os
          from fire_public.cli import API, HEX_ID, api_request, verify_free

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not HEX_ID.fullmatch(account) or not token:
              raise RuntimeError("Cloudflare account ID and scoped token are required")
          try:
              verify_free(account, token)
          except RuntimeError:
              payload = api_request(f"{API}/accounts/{account}/subscriptions", token)
              info = payload.get("result_info")
              result = payload.get("result")
              print("Subscription response shape:", {
                  "result_type": type(result).__name__,
                  "result_length": len(result) if isinstance(result, list) else None,
                  "result_info_type": type(info).__name__,
                  "result_info_fields": sorted(info) if isinstance(info, dict) else None,
                  "pagination": {key: info.get(key) for key in
                                 ("count", "page", "per_page", "total_count")}
                  if isinstance(info, dict) else None,
              }, flush=True)
              raise
          print("Cloudflare account subscriptions verified as Free; no resource was created")
          PY
