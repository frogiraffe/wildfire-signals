name: NIFC reproducible multi-year government evidence study
on:
  pull_request:
    paths:
      - 'fire_public/official_perimeters.py'
      - 'fire_public/mtbs_pilot.py'
      - 'tests/test_mtbs_pilot.py'
      - 'fire_public/perimeter_study.py'
      - 'fire_public/perimeter_quality.py'
      - 'fire_public/official_lead_refresh.py'
      - 'fire_public/official_context_archive.py'
      - 'fire_public/review_form.py'
      - 'tests/test_official_context_archive.py'
      - 'tests/test_review_form.py'
      - 'tests/test_official_lead_refresh.py'
      - 'tests/test_perimeter_study.py'
      - 'tests/test_perimeter_quality.py'
      - 'fire_public/label_review.py'
      - 'tests/test_label_review.py'
      - '.github/workflows/test-perimeter-study.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/official_perimeters.py'
      - 'fire_public/mtbs_pilot.py'
      - 'tests/test_mtbs_pilot.py'
      - 'fire_public/perimeter_study.py'
      - 'fire_public/perimeter_quality.py'
      - 'fire_public/official_lead_refresh.py'
      - 'fire_public/official_context_archive.py'
      - 'fire_public/review_form.py'
      - 'tests/test_official_context_archive.py'
      - 'tests/test_review_form.py'
      - 'tests/test_official_lead_refresh.py'
      - 'tests/test_perimeter_study.py'
      - 'tests/test_perimeter_quality.py'
      - 'fire_public/label_review.py'
      - 'tests/test_label_review.py'
      - '.github/workflows/test-perimeter-study.yml'
permissions:
  contents: read
jobs:
  offline-study:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Multi-year sampling, source digest and history regressions
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_perimeter_study.py' -v
          python -m unittest discover -s tests -p 'test_perimeter_quality.py' -v
          python -m unittest discover -s tests -p 'test_official_perimeters.py' -v
          python -m unittest discover -s tests -p 'test_mtbs_pilot.py' -v
          python -m unittest discover -s tests -p 'test_workbench_official_perimeters.py' -v
          python -m unittest discover -s tests -p 'test_official_live_probe.py' -v
          python -m unittest discover -s tests -p 'test_official_lead_refresh.py' -v
          python -m unittest discover -s tests -p 'test_official_context_archive.py' -v
          python -m unittest discover -s tests -p 'test_review_form.py' -v
          python -m unittest discover -s tests -p 'test_evidence_receipts.py' -v

  real-multi-year-nifc:
    needs: offline-study
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 4 real official records from each of two historical years
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/wildfire-nifc-multiyear
          python -m fire_public.perimeter_study sync \
            --db /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3 \
            --year 2017 --year 2018 \
            --records-per-year 4 \
            --seed wildfire-ci-source-sample-v1 \
            --report /tmp/wildfire-nifc-multiyear/study.json \
            --geojson /tmp/wildfire-nifc-multiyear/study.geojson \
            2>&1 | tee /tmp/wildfire-nifc-multiyear/live.log
          python -m fire_public.perimeter_quality \
            --db /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3 \
            --at "$(python -c "import json;print(json.load(open('/tmp/wildfire-nifc-multiyear/study.json'))['decision_at'])")" \
            --year 2017 --year 2018 \
            --json /tmp/wildfire-nifc-multiyear/quality.json \
            --html /tmp/wildfire-nifc-multiyear/quality.html
          # These units are SYNTHETIC frame controls used only to prove
          # source-to-queue wiring. Neither is a confirmed non-fire observation.
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/wildfire-nifc-multiyear')
          frame={
            'schema_version':1,
            'frame_name':'CI SYNTHETIC unlabeled region-time units',
            'sampling_protocol':'Fixture-only test of review queue data contracts',
            'frame_provenance':'Synthetic demonstration; NOT a vetted incident/non-fire frame',
            'source_url':'https://example.org/synthetic-ci-frame',
            'rights_url':'https://example.org/synthetic-ci-rights',
            'units':[
              {'sampling_unit_id':'synthetic-2017','region_id':'ci-region-a',
               'latitude':37.0,'longitude':-120.0,'decision_at':'2017-07-05T00:00:00Z'},
              {'sampling_unit_id':'synthetic-2018','region_id':'ci-region-b',
               'latitude':38.0,'longitude':-119.0,'decision_at':'2018-07-05T00:00:00Z'}
            ]
          }
          (root/'synthetic-frame.json').write_text(json.dumps(frame))
          PY
          python -m fire_public.label_review prepare \
            --perimeter-db /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3 \
            --frame /tmp/wildfire-nifc-multiyear/synthetic-frame.json \
            --at "$(python -c "import json;print(json.load(open('/tmp/wildfire-nifc-multiyear/study.json'))['decision_at'])")" \
            --year 2017 --year 2018 --max-controls 2 \
            --output /tmp/wildfire-nifc-multiyear/unadjudicated-queue.json
          mkdir -p /tmp/wildfire-nifc-multiyear/private-context-store
          python -m fire_public.official_lead_refresh \
            --queue /tmp/wildfire-nifc-multiyear/unadjudicated-queue.json \
            --perimeter-db /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3 \
            --max-leads 8 \
            --json /tmp/wildfire-nifc-multiyear/official-lead-reconciliation.json \
            --source-dir /tmp/wildfire-nifc-multiyear/live-source-responses \
            --context-store /tmp/wildfire-nifc-multiyear/private-context-store
          python -m fire_public.official_context_archive \
            --queue /tmp/wildfire-nifc-multiyear/unadjudicated-queue.json \
            --store /tmp/wildfire-nifc-multiyear/private-context-store \
            --output /tmp/wildfire-nifc-multiyear/source-context-audit.json
          python -m fire_public.review_form \
            --queue /tmp/wildfire-nifc-multiyear/unadjudicated-queue.json \
            --official-context-store /tmp/wildfire-nifc-multiyear/private-context-store \
            --reviewer-id ci-fixture-not-a-real-reviewer \
            --html /tmp/wildfire-nifc-multiyear/offline-reviewed-context.html
          python -m fire_public.mtbs_pilot \
            --year 2017 --year 2018 \
            --records-per-year 4 \
            --seed wildfire-mtbs-ci-v1 \
            --nifc-db /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3 \
            --nifc-at "$(python -c "import json;print(json.load(open('/tmp/wildfire-nifc-multiyear/study.json'))['decision_at'])")" \
            --output-dir /tmp/wildfire-nifc-multiyear/mtbs-real-public-source
          python - <<'PY'
          import json
          from pathlib import Path
          from fire_public.perimeter_study import study_report
          root=Path('/tmp/wildfire-nifc-multiyear')
          result=json.loads((root/'study.json').read_text())
          geo=json.loads((root/'study.geojson').read_text())
          assert result['requested_fire_years']==[2017,2018]
          assert result['complete_requested_year_sample']
          assert result['stored_polygon_records']==8
          assert len(geo['features'])==8
          assert all(row['sample_selection_mode']=='hash' for row in result['year_results'])
          assert all(row['source_object_ids']>=4 for row in result['year_results'])
          assert result['negative_labels_created']==0
          assert result['source_fire_occurrence_coverage_complete'] is False
          restored,_=study_report(root/'nifc-2017-2018.sqlite3',
                                  at=result['decision_at'],years=[2017,2018])
          assert restored['stored_polygon_records']==8
          quality=json.loads((root/'quality.json').read_text())
          assert quality['sampled_polygons_total']==8
          assert quality['negative_labels_created']==0
          assert quality['forecast_skill_measured'] is False
          assert quality['year_quality'][0]['sampled_record_count']==4
          assert quality['year_quality'][1]['sampled_record_count']==4
          queue=json.loads((root/'unadjudicated-queue.json').read_text())
          assert queue['counts']['official_perimeter_leads']==8
          assert queue['counts']['unlabeled_frame_units']==2
          assert queue['negative_labels_created']==0
          assert all(case['proposed_label'] is None for case in queue['cases'])
          assert queue['sampling_frame']['selection_strategy']=='seeded_hash_region_round_robin'
          assert queue['sampling_frame']['selected_by_region']=={'ci-region-a':1,'ci-region-b':1}
          refresh=json.loads((root/'official-lead-reconciliation.json').read_text())
          assert refresh['reviewed_official_leads']==8
          assert refresh['official_source_requests']==2
          assert refresh['transport']=='direct_pinned_official_https'
          assert refresh['independent_outcomes_verified']==0
          assert refresh['independently_verified_negative_labels']==0
          context=json.loads((root/'source-context-audit.json').read_text())
          assert context['official_source_context_consistent']
          assert context['official_leads']==8
          assert context['verified_raw_source_pages']==2
          assert context['valid_binary_outcomes_created']==0
          assert context['valid_negative_labels_created']==0
          assert context['transport_claim']=='direct_pinned_official_https'
          mtbs_root=root/'mtbs-real-public-source'
          mtbs=json.loads((mtbs_root/'sample-summary.json').read_text())
          pairs=json.loads((mtbs_root/'nifc-proximity-candidates.json').read_text())
          assert mtbs['source_transport']=='direct_fixed_usfs_https'
          assert mtbs['sampled_source_points']==8
          assert mtbs['years']==[2017,2018]
          assert mtbs['negative_fire_labels_created']==0
          assert mtbs['outcome_independence_established'] is False
          assert pairs['nifc_sampled_source_polygons']==8
          assert pairs['nonmatches_count_as_absent_fires'] is False
          assert pairs['negative_fire_labels_created']==0
          import hashlib
          for year in mtbs['source_years']:
            for src in year['raw_source_files']:
              original=(mtbs_root/src['filename']).read_bytes()
              assert hashlib.sha256(original).hexdigest()==src['sha256']
          assert len(context['case_findings'])==8
          assert (root/'offline-reviewed-context.html').is_file()
          import hashlib
          for source in refresh['source_response_evidence']:
            path=root/'live-source-responses'/source['filename']
            raw=path.read_bytes()
            assert hashlib.sha256(raw).hexdigest()==source['sha256']
          print('Confirmed authentic US government responses in 2 distinct years, 8 archived GeoJSON perimeters.')
          PY
      - name: Preserve real research sample and source coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifc-real-multiyear-sample
          path: |
            /tmp/wildfire-nifc-multiyear/nifc-2017-2018.sqlite3
            /tmp/wildfire-nifc-multiyear/study.json
            /tmp/wildfire-nifc-multiyear/study.geojson
            /tmp/wildfire-nifc-multiyear/quality.json
            /tmp/wildfire-nifc-multiyear/quality.html
            /tmp/wildfire-nifc-multiyear/unadjudicated-queue.json
            /tmp/wildfire-nifc-multiyear/synthetic-frame.json
            /tmp/wildfire-nifc-multiyear/official-lead-reconciliation.json
            /tmp/wildfire-nifc-multiyear/source-context-audit.json
            /tmp/wildfire-nifc-multiyear/offline-reviewed-context.html
            /tmp/wildfire-nifc-multiyear/private-context-store/
            /tmp/wildfire-nifc-multiyear/mtbs-real-public-source/
            /tmp/wildfire-nifc-multiyear/live-source-responses/
            /tmp/wildfire-nifc-multiyear/live.log
          if-no-files-found: warn
          retention-days: 7
