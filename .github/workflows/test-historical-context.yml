name: Historical multi-source context
on:
  pull_request:
    paths:
      - 'fire_public/historical_context.py'
      - 'fire_public/intelligence_workbench.py'
      - 'tests/test_historical_context.py'
      - '.github/workflows/test-historical-context.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/historical_context.py'
      - 'fire_public/intelligence_workbench.py'
      - 'tests/test_historical_context.py'
      - '.github/workflows/test-historical-context.yml'
permissions:
  contents: read
jobs:
  multisource-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify all offline historical evidence paths
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_historical_context.py' -v
          python -m unittest discover -s tests -p 'test_intelligence_workbench.py' -v
          python -m unittest discover -s tests -p 'test_decision_evidence.py' -v
          python -m unittest discover -s tests -p 'test_weather_pilot.py' -v
          python -m unittest discover -s tests -p 'test_history.py' -v
