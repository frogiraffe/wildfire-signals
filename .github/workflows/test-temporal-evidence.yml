name: Global temporal evidence tests
on:
  push:
    paths:
      - 'fire_public/temporal_evidence.py'
      - 'tests/test_temporal_evidence.py'
      - '.github/workflows/test-temporal-evidence.yml'
  pull_request:
    paths:
      - 'fire_public/temporal_evidence.py'
      - 'tests/test_temporal_evidence.py'
      - '.github/workflows/test-temporal-evidence.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run global evidence regression tests
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_region_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_temporal_evidence.py' -v
