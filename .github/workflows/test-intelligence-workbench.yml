name: Historical intelligence workbench
on:
  pull_request:
    paths:
      - 'fire_public/intelligence_workbench.py'
      - 'tests/test_intelligence_workbench.py'
      - '.github/workflows/test-intelligence-workbench.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/intelligence_workbench.py'
      - 'tests/test_intelligence_workbench.py'
      - '.github/workflows/test-intelligence-workbench.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline verified receipt history and workbench integration
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_intelligence_workbench.py' -v
          python -m unittest discover -s tests -p 'test_receipt_history.py' -v
          python -m unittest discover -s tests -p 'test_history.py' -v
          python -m unittest discover -s tests -p 'test_region_diagnostics.py' -v
