name: Check Pages preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_SNAPSHOT_URL: ${{ vars.PUBLIC_SNAPSHOT_URL }}
    steps:
      - name: Check deployed map and KV binding without writing data
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import urlopen

          url = os.environ.get("PUBLIC_SNAPSHOT_URL", "")
          parsed = urlsplit(url)
          if (parsed.scheme != "https" or not (parsed.hostname or "").endswith(".pages.dev")
                  or parsed.path != "/api/snapshot" or parsed.query or parsed.fragment):
              raise RuntimeError("PUBLIC_SNAPSHOT_URL is not a Pages snapshot endpoint")
          root = f"https://{parsed.hostname}/"
          with urlopen(root, timeout=20) as response:
              html = response.read(256_000)
              if response.status != 200 or b"Wildfire Signals" not in html:
                  raise RuntimeError("Pages map is not serving the expected page")
          try:
              response = urlopen(url, timeout=20)
          except HTTPError as error:
              response = error
          with response:
              status = response.status
              binding = response.headers.get("x-public-binding")
              encoding = response.headers.get("content-encoding")
              body = response.read(5 * 1024 * 1024 + 1)
          if len(body) > 5 * 1024 * 1024:
              raise RuntimeError("Pages snapshot exceeds the 5 MiB budget")
          if status == 503:
              if binding != "ready" or json.loads(body).get("error") != "snapshot_unavailable":
                  raise RuntimeError("Pages Function or KV binding is not ready")
              print("Pages map and KV binding are live; first snapshot is pending")
          elif status == 200:
              snapshot = json.loads(gzip.decompress(body) if encoding == "gzip" else body)
              if (snapshot.get("manifest", {}).get("schema_version") != 1
                      or not isinstance(snapshot.get("events"), list)):
                  raise RuntimeError("Pages snapshot schema is invalid")
              print("Pages map and public snapshot are live")
          else:
              raise RuntimeError(f"Unexpected snapshot status: {status}")
          PY
