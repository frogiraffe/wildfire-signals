name: Check Pages preview
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Pages hostname to check
        required: false
        default: wildfire-signals.pages.dev
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGES_HOST: ${{ inputs.hostname }}
    steps:
      - name: Check deployed map and KV binding without writing data
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          host = os.environ.get("PAGES_HOST") or "wildfire-signals.pages.dev"
          if not re.fullmatch(r"(?:[a-f0-9]{8}\.)?wildfire-signals\.pages\.dev", host):
              raise RuntimeError("Unexpected Pages hostname")
          url = f"https://{host}/api/snapshot"
          parsed = urlsplit(url)
          if (parsed.scheme != "https" or not (parsed.hostname or "").endswith(".pages.dev")
                  or parsed.path != "/api/snapshot" or parsed.query or parsed.fragment):
              raise RuntimeError("PUBLIC_SNAPSHOT_URL is not a Pages snapshot endpoint")
          root = f"https://{parsed.hostname}/"
          headers = {"User-Agent": "WildfireSignals/0.1"}
          try:
              root_response = urlopen(Request(root, headers=headers), timeout=20)
          except HTTPError as error:
              page = error.read(2000).decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", page, re.I | re.S)
              error_code = re.search(r"(?:Error|error code)\s*(\d{3,4})", page)
              print("Pages root rejection:", {
                  "status": error.code,
                  "server": error.headers.get("server"),
                  "cf_mitigated": error.headers.get("cf-mitigated"),
                  "title": re.sub(r"\s+", " ", title.group(1)).strip()[:120] if title else None,
                  "cloudflare_error_code": error_code.group(1) if error_code else None,
                  "body_prefix": re.sub(r"\s+", " ", page[:120]).strip(),
              }, flush=True)
              raise
          with root_response as response:
              html = response.read(256_000)
              if response.status != 200 or b"Wildfire Signals" not in html:
                  raise RuntimeError("Pages map is not serving the expected page")
          try:
              response = urlopen(Request(url, headers={**headers, "Accept-Encoding": "gzip"}), timeout=20)
          except HTTPError as error:
              response = error
          with response:
              status = response.status
              binding = response.headers.get("x-public-binding")
              encoding = response.headers.get("content-encoding")
              body = response.read(5 * 1024 * 1024 + 1)
          print("Snapshot response:", {"status": status, "encoding": encoding,
                                       "content_type": response.headers.get("content-type"),
                                       "gzip_magic": body.startswith(b"\x1f\x8b"),
                                       "body_bytes": len(body)}, flush=True)
          if len(body) > 5 * 1024 * 1024:
              raise RuntimeError("Pages snapshot exceeds the 5 MiB budget")
          if status == 503:
              if binding != "ready" or json.loads(body).get("error") != "snapshot_unavailable":
                  raise RuntimeError("Pages Function or KV binding is not ready")
              print("Pages map and KV binding are live; first snapshot is pending")
          elif status == 200:
              snapshot = json.loads(gzip.decompress(body) if encoding == "gzip" else body)
              if (snapshot.get("manifest", {}).get("schema_version") != 1
                      or not isinstance(snapshot.get("events"), list)):
                  raise RuntimeError("Pages snapshot schema is invalid")
              print("Pages map and public snapshot are live")
          else:
              raise RuntimeError(f"Unexpected snapshot status: {status}")
          PY
