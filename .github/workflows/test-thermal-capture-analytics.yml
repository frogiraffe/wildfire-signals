name: Verified FIRMS capture analytics and experimental baseline
on:
  pull_request:
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/thermal_capture_analytics.py'
      - 'fire_public/historical_rollup.py'
      - 'fire_public/environmental_analytics.py'
      - 'fire_public/annual_country_analytics.py'
      - 'fire_public/observation_opportunity.py'
      - 'fire_public/acquisition_catalog.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_thermal_capture_analytics.py'
      - 'tests/test_historical_rollup.py'
      - 'tests/test_environmental_analytics.py'
      - 'tests/test_annual_country_analytics.py'
      - 'tests/test_observation_opportunity.py'
      - 'tests/test_acquisition_catalog.py'
      - 'examples/thermal-capture-regions.json'
      - 'examples/batman-*.json'
      - 'examples/sacramento-*.json'
      - 'examples/antalya-annual-manifest-2023-2025.json'
      - 'examples/dalaman-annual-manifest-2023-2025.json'
      - 'public/data/thermal-capture-pilot-2026-10-13.json'
      - 'public/data/batman-weather-context-2026-10-11.json'
      - 'public/data/sacramento-weather-context-2026-10-11.json'
      - 'public/data/antalya-annual-context-2023-2025.json'
      - 'public/data/dalaman-annual-context-2023-2025.json'
      - 'public/data/batman-cmr-context-2026-10-11.json'
      - 'public/data/batman-cmr-paired-products-2026-10-11.json'
      - 'docs/research/source-samples/batman-cmr-2026-10-09-11.json'
      - 'docs/research/source-samples/batman-active-cmr-2026-10-09-11.json'
      - '.github/workflows/test-thermal-capture-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/thermal_capture_analytics.py'
      - 'fire_public/historical_rollup.py'
      - 'fire_public/environmental_analytics.py'
      - 'fire_public/annual_country_analytics.py'
      - 'fire_public/observation_opportunity.py'
      - 'fire_public/acquisition_catalog.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_thermal_capture_analytics.py'
      - 'tests/test_historical_rollup.py'
      - 'tests/test_environmental_analytics.py'
      - 'tests/test_annual_country_analytics.py'
      - 'tests/test_observation_opportunity.py'
      - 'tests/test_acquisition_catalog.py'
      - 'examples/thermal-capture-regions.json'
      - 'examples/batman-*.json'
      - 'examples/sacramento-*.json'
      - 'examples/antalya-annual-manifest-2023-2025.json'
      - 'examples/dalaman-annual-manifest-2023-2025.json'
      - 'public/data/thermal-capture-pilot-2026-10-13.json'
      - 'public/data/batman-weather-context-2026-10-11.json'
      - 'public/data/sacramento-weather-context-2026-10-11.json'
      - 'public/data/antalya-annual-context-2023-2025.json'
      - 'public/data/dalaman-annual-context-2023-2025.json'
      - 'public/data/batman-cmr-context-2026-10-11.json'
      - 'public/data/batman-cmr-paired-products-2026-10-11.json'
      - 'docs/research/source-samples/batman-cmr-2026-10-09-11.json'
      - 'docs/research/source-samples/batman-active-cmr-2026-10-09-11.json'
      - '.github/workflows/test-thermal-capture-analytics.yml'
permissions:
  contents: read
jobs:
  offline-receipt-and-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify importer, numerical model, temporal holdout and evidence integrity
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_release_sync.py' -v
          python -m unittest discover -s tests -p 'test_thermal_capture_analytics.py' -v
          python -m unittest discover -s tests -p 'test_historical_rollup.py' -v
          python -m unittest discover -s tests -p 'test_environmental_analytics.py' -v
          python -m unittest discover -s tests -p 'test_annual_country_analytics.py' -v
          python -m unittest discover -s tests -p 'test_observation_opportunity.py' -v
          python -m unittest discover -s tests -p 'test_acquisition_catalog.py' -v
