name: Verified FIRMS capture analytics and experimental baseline
on:
  pull_request:
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/thermal_capture_analytics.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_thermal_capture_analytics.py'
      - 'examples/thermal-capture-regions.json'
      - 'public/data/thermal-capture-pilot-2026-10-13.json'
      - '.github/workflows/test-thermal-capture-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'fire_public/release_sync.py'
      - 'fire_public/thermal_capture_analytics.py'
      - 'tests/test_release_sync.py'
      - 'tests/test_thermal_capture_analytics.py'
      - 'examples/thermal-capture-regions.json'
      - 'public/data/thermal-capture-pilot-2026-10-13.json'
      - '.github/workflows/test-thermal-capture-analytics.yml'
permissions:
  contents: read
jobs:
  offline-receipt-and-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify importer, numerical model, temporal holdout and evidence integrity
        run: |
          python -m compileall -q fire_public
          python -m unittest discover -s tests -p 'test_release_sync.py' -v
          python -m unittest discover -s tests -p 'test_thermal_capture_analytics.py' -v
