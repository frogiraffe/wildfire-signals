<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101a23">
  <title>Fire Monitor — global fire observations</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div><span class="eyebrow">FIRE MONITOR · PUBLIC MAP</span><h1 data-i18n="title">Fire Monitor</h1></div>
      <div class="top-actions"><label for="language" data-i18n="language">Language</label><select id="language" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select><button id="share" type="button" data-i18n="link">Share view</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>
    <main>
      <aside class="sidebar" aria-label="Map filters and sources">
        <p class="intro" data-i18n="about">Thermal detections are candidates, not confirmed fires.</p>
        <div class="counts"><div><strong id="candidate-count">–</strong><span data-i18n="candidates">Satellite candidates</span></div><div><strong id="incident-count">–</strong><span data-i18n="incidents">Agency incidents</span></div></div>
        <label for="hours" data-i18n="time">Time window</label><select id="hours"><option value="6">6 h</option><option value="24">24 h</option><option value="72">72 h</option></select>
        <label for="source" data-i18n="source">Source</label><select id="source"><option value="all" data-i18n="all">All sources</option></select>
        <label for="kind" data-i18n="status">Status</label><select id="kind"><option value="all" data-i18n="allKinds">All</option><option value="candidate" data-i18n="candidates">Satellite candidates</option><option value="incident" data-i18n="incidents">Agency incidents</option></select>
        <section class="source-health"><h2 data-i18n="health">Source health</h2><ul id="source-list"></ul></section>
        <p class="last-scan"><span data-i18n="updated">Last scan</span>: <time id="last-scan">–</time></p>
        <p class="source-credits">Data: <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" rel="noopener noreferrer">NASA FIRMS</a> · <a href="https://www.nifc.gov/fire-information/maps" target="_blank" rel="noopener noreferrer">NIFC WFIGS</a> · <a href="https://cwfis.cfs.nrcan.gc.ca/en/" target="_blank" rel="noopener noreferrer">CWFIS / Natural Resources Canada</a>. <span data-i18n="sourceCaveat">Coverage and update times vary by source.</span></p>
      </aside>
      <div id="map" role="application" aria-label="Interactive global wildfire observation map"></div>
      <aside id="detail" class="detail" aria-label="Selected record" hidden><button id="detail-close" type="button" aria-label="Close details">×</button><div id="detail-content"></div></aside>
    </main>
  </div>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
